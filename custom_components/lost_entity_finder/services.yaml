find_entity_references:
  name: Find Entity References
  description: Scan supported configs and raise a repair listing where an entity ID is referenced.
  fields:
    entity_id:
      name: Entity ID
      description: The entity ID to search for (for example sensor.kitchen_temp).
      required: true
      example: sensor.kitchen_temp
      selector:
        text:

check_entity_id_pair:
  name: Check Entity ID Pair
  description: Check one or more old-to-new entity ID pairs and sync repairs.
  fields:
    renames:
      name: Renames
      description: Mapping of old entity IDs to new entity IDs. Use one entry for a single pair, or many for bulk renames.
      required: true
      example: '{"light.old": "light.new", "climate.upstairs": "climate.upstairs_aircon"}'
      selector:
        object:
    create_repair_without_references:
      name: Create Repair Without References
      description: When enabled, create a repair even if no references to the old entity ID are found.
      required: false
      default: false
      example: false
      selector:
        boolean:
